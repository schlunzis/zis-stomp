name: Maven Verify

permissions: { }

on:
  push:
    branches-ignore:
      - main
  pull_request:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ 25 ]
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          fetch-depth: 0
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          java-version: ${{ matrix.java }}
          distribution: 'zulu'
          cache: "maven"
      - name: Start Mock Server
        run: |
          cd test/mock-server
          nohup ../../mvnw -B -DskipTests spring-boot:run > mock-server.log 2>&1 &
          echo $! > mock-server.pid
          sleep 10
      - name: Build and Test
        run: |
          ./mvnw clean verify -P integration-test --batch-mode --update-snapshots
      - name: Stop Mock Server
        run: |
          cd test/mock-server
          kill "$(cat mock-server.pid)" || true
          rm mock-server.pid || true
      - name: Test Reproducibility
        run: |
          ./mvnw clean install -DskipTests --batch-mode
          ./mvnw clean verify artifact:compare -DskipTests --batch-mode
