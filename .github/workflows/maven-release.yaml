name: Maven Publish

permissions: { }

on:
  push:
    branches:
      - main

jobs:
  test:
    uses: ./.github/workflows/maven-verify.yaml

  publish:
    if: github.repository == 'schlunzis/zis-stomp'
    needs: test
    runs-on: ubuntu-latest
    name: Publish to Maven Central
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0

      - name: Read commit time
        id: commit_time
        run: |
          COMMIT_TIME=$(git log -1 --format=%cI)
          echo "COMMIT_TIME=$COMMIT_TIME"
          echo "COMMIT_TIME=$COMMIT_TIME" >> $GITHUB_OUTPUT

      - name: Set up JDK and Maven Central Repository
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          java-version: 25
          distribution: 'temurin'
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Publish package
        run: ./mvnw -Dmaven.test.skip=true -Dproject.build.outputTimestamp=${COMMIT_TIME} --batch-mode --update-snapshots -P publish deploy
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_SONATYPE_TOKEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_SONATYPE_TOKEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
          COMMIT_TIME: ${{ steps.commit_time.outputs.COMMIT_TIME }}

  publish-site:
    needs: publish
    uses: ./.github/workflows/publish-site.yaml
    secrets: inherit
